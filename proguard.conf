# ============================================================
# 基础设置
# ============================================================

# 不删除未使用代码
-dontshrink

# 不做字节码优化
-dontoptimize

# Java 21不要使用-dontpreverify
# 否则可能出现：
# VerifyError: Expecting a stackmap frame

# 忽略第三方库警告
-dontwarn
-dontnote


# ============================================================
# 保留Class必要元数据
# ============================================================

# 异常声明
-keepattributes Exceptions

# 内部类信息
-keepattributes InnerClasses

# 泛型信息
-keepattributes Signature

# Deprecated信息
-keepattributes Deprecated

# 源文件名
-keepattributes SourceFile

# 行号
-keepattributes LineNumberTable

# 注解
-keepattributes *Annotation*

# 内部类和外部类关联关系
-keepattributes EnclosingMethod


# ============================================================
# JavaFX启动类
# ============================================================

# 主程序入口完整保留
-keep public class cn.you.ftpsynchronization.FtpSynchronizationApplication {
    *;
}

# JavaFX实际启动类完整保留
-keep public class cn.you.ftpsynchronization.FxStart {
    *;
}


# ============================================================
# JavaFX Application
# ============================================================

# 所有继承JavaFX Application的类完整保留
-keep class * extends javafx.application.Application {
    *;
}


# ============================================================
# JavaFX Controller
# ============================================================

# 你的FXML Controller实际位于view包
# FXML通过fx:controller完整类名加载，因此类名不能混淆
-keep class cn.you.ftpsynchronization.view.** {
    *;
}


# ============================================================
# FXML字段和方法
# ============================================================

# @FXML字段不能改名
-keepclassmembers class * {
    @javafx.fxml.FXML <fields>;
}

# @FXML方法不能改名
-keepclassmembers class * {
    @javafx.fxml.FXML <methods>;
}


# ============================================================
# POJO / JSON配置实体
# ============================================================

# Jackson需要根据字段/getter/setter读取和写入JSON
# 为保证旧规则配置兼容，pojo包第一阶段完整保留
-keep class cn.you.ftpsynchronization.pojo.** {
    *;
}


# ============================================================
# Jackson注解
# ============================================================

# @JsonProperty字段
-keepclassmembers class * {
    @com.fasterxml.jackson.annotation.JsonProperty <fields>;
}

# @JsonProperty方法
-keepclassmembers class * {
    @com.fasterxml.jackson.annotation.JsonProperty <methods>;
}

# @JsonCreator方法
-keepclassmembers class * {
    @com.fasterxml.jackson.annotation.JsonCreator <methods>;
}

# @JsonIgnore字段和方法
-keepclassmembers class * {
    @com.fasterxml.jackson.annotation.JsonIgnore <fields>;
    @com.fasterxml.jackson.annotation.JsonIgnore <methods>;
}


# ============================================================
# JavaBean Getter / Setter
# ============================================================

# Getter暂时保留名称
-keepclassmembers class cn.you.ftpsynchronization.** {
    public *** get*();
}

# Setter暂时保留名称
-keepclassmembers class cn.you.ftpsynchronization.** {
    public void set*(***);
}

# boolean Getter
-keepclassmembers class cn.you.ftpsynchronization.** {
    public boolean is*();
}


# ============================================================
# Controller构造方法
# ============================================================

# FXML加载Controller时通常需要构造方法
-keepclassmembers class cn.you.ftpsynchronization.view.** {
    public <init>();
}


# ============================================================
# POJO构造方法
# ============================================================

# Jackson通常需要无参构造方法
-keepclassmembers class cn.you.ftpsynchronization.pojo.** {
    public <init>();
}


# ============================================================
# Enum
# ============================================================

# 枚举标准方法保留
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}


# ============================================================
# Serializable
# ============================================================

# Java序列化版本字段保留
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
}


# ============================================================
# main方法
# ============================================================

# 所有main入口保留
-keepclasseswithmembers public class * {
    public static void main(java.lang.String[]);
}
